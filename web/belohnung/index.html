<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbf6ee">
<title>Laden &amp; Spielhalle · LernDax</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" href="../icons/favicon-v4.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon-v4.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<!-- Belohnungen wie bei Anton (Wunsch des Kindes, 16.11.2026): Münzen ausgeben im Laden (Avatar) und in der Spielhalle.
     Regeln und Speicher: ../plattform/belohnung.js · Spiele: spiele.js -->
<style>
:root{--ink:#1c1a33;--soft:#6b6680;--paper:#fbf6ee;--card:#fff;--tint:#f3ede2;--c1:#ff6b3d;--c2:#3d7bff;--c3:#14a06c;--c4:#8b5cf6;--c5:#e9a800;--gold:#fff6d6;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font:500 17px/1.45 Nunito,system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
h1,h2,h3{font-family:"Bricolage Grotesque",Nunito,system-ui,sans-serif;letter-spacing:-.01em;margin:0}
button{font:inherit;color:inherit}
#app{max-width:560px;margin:0 auto;padding:14px 16px 40px;min-height:100vh}
.top{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.back{flex:0 0 auto;width:44px;height:44px;border-radius:13px;border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);background:var(--card);display:grid;place-items:center;font-size:22px;font-weight:800;text-decoration:none;color:var(--ink);cursor:pointer}
.top h1{font-size:24px;flex:1;min-width:0}
.pill{display:flex;align-items:center;gap:4px;background:var(--gold);border:2px solid var(--ink);border-radius:99px;padding:3px 10px;min-height:36px;font-weight:800;font-size:16px;white-space:nowrap}
.card{background:var(--card);border:2px solid var(--ink);border-radius:18px;box-shadow:4px 4px 0 var(--ink);padding:14px;margin-bottom:16px}
.btn{display:block;width:100%;border:2px solid var(--ink);border-radius:14px;box-shadow:3px 3px 0 var(--ink);background:var(--c1);font-weight:800;font-size:18px;padding:12px;cursor:pointer;text-align:center;text-decoration:none;color:var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:none}
.btn.hell{background:var(--card)}
.btn:disabled{background:#e9e4da;color:#8a8597;box-shadow:none;cursor:default}
.leise{color:var(--soft);font-weight:700;font-size:15px;margin:6px 0 0}
/* Übersicht */
.held{display:flex;align-items:center;gap:16px;margin:4px 0 18px}
.held h2{font-size:26px;line-height:1.15}
.held p{margin:4px 0 0;color:var(--soft);font-weight:700}
.wahl{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.wahl a{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-decoration:none;color:var(--ink);background:var(--gold);border:2px solid var(--ink);border-radius:18px;box-shadow:4px 4px 0 var(--ink);padding:14px}
.wahl a.sp{background:#e8f0ff}
.wahl a:active{transform:translate(4px,4px);box-shadow:none}
.wahl .ic{font-size:34px;line-height:1}
.wahl b{font:800 20px "Bricolage Grotesque",Nunito,system-ui,sans-serif}
.wahl small{color:var(--soft);font-weight:800;font-size:13px;line-height:1.3}
.regeln h3{font-size:18px;margin-bottom:6px}
.regeln ul{margin:0;padding-left:20px}
.regeln li{margin:3px 0;font-weight:700}
/* Laden */
.vorschau{display:flex;align-items:center;gap:14px}
.vorschau .tx{flex:1;min-width:0}
.vorschau h2{font-size:21px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 12px;padding:2px 16px 6px}
.tab{flex:0 0 auto;border:2px solid var(--ink);border-radius:99px;background:var(--card);padding:6px 13px;font-weight:800;font-size:15px;cursor:pointer}
.tab.on{background:var(--ink);color:#fff}
.waren{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:96px}
.ware{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:8px 4px 6px;cursor:pointer;min-width:0}
.ware.sel{box-shadow:0 0 0 3px var(--c1)}
.ware b{font-size:13px;line-height:1.15;text-align:center}
.ware .preis{font-weight:800;font-size:14px}
.ware .preis.hat{color:var(--c3)}
.ware .an{position:absolute;top:4px;right:6px;font-size:13px;font-weight:800;color:#fff;background:var(--c3);border:2px solid var(--ink);border-radius:99px;padding:0 6px}
.leiste{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--paper) 30%)}
.leiste .btn{max-width:528px;margin:0 auto}
/* Spielhalle */
.zeit{display:flex;gap:10px;margin:8px 0 12px}
.zeit div{flex:1;background:var(--tint);border-radius:12px;padding:8px 10px}
.zeit b{display:block;font:800 22px "Bricolage Grotesque",Nunito,system-ui,sans-serif}
.zeit span{font-size:13px;font-weight:800;color:var(--soft)}
.balken{height:10px;border:2px solid var(--ink);border-radius:99px;background:var(--card);overflow:hidden;margin:4px 0 2px}
.balken i{display:block;height:100%;background:var(--c2)}
.spiele{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.spiel{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--card);border:2px solid var(--ink);border-radius:18px;box-shadow:4px 4px 0 var(--ink);padding:14px 8px 12px;cursor:pointer}
.spiel:active{transform:translate(4px,4px);box-shadow:none}
.spiel .bild{width:64px;height:64px;border-radius:16px;border:2px solid var(--ink);display:grid;place-items:center;font:800 22px "Bricolage Grotesque",Nunito,sans-serif;overflow:hidden}
.spiel .bild img{width:54px;height:54px}
.spiel b{font-size:17px}
.spiel small{color:var(--soft);font-weight:800;font-size:13px}
.zu{text-align:center}
.zu .gross{font-size:46px;line-height:1.1}
/* Spielen: Spielkonsole wie ein Gameboy (Steuerkreuz links, A/B rechts, Start = Pause), v116 */
.spielkopf{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.spielkopf .uhr{margin-left:auto}
.gb{background:#e6e1d6;border:2px solid var(--ink);border-radius:22px 22px 54px 22px;box-shadow:4px 4px 0 var(--ink);padding:12px 12px 16px;max-width:460px;margin:0 auto;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.gb-schirm{background:#4a4766;border-radius:12px 12px 30px 12px;padding:10px 10px 8px}
.buehne{position:relative;border:2px solid var(--ink);border-radius:8px;overflow:hidden;background:var(--card);touch-action:none;margin:0 auto}
.buehne canvas{display:block;width:100%;height:auto}
.gb-info{display:flex;justify-content:space-between;gap:8px;color:#e9e6f5;font-weight:800;font-size:14px;margin-top:6px;padding:0 2px}
.gb-info b{color:#fff}
.deckel{position:absolute;inset:0;display:grid;place-items:center;background:rgba(251,246,238,.93);text-align:center;padding:12px}
.deckel h2{font-size:24px;margin-bottom:4px}
.deckel .btn{margin-top:10px}
.gb-marke{font:800 12px "Bricolage Grotesque",Nunito,sans-serif;letter-spacing:.18em;color:#8a8597;margin:8px 2px 0}
.gb-pult{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px;touch-action:none}
.kreuz{position:relative;width:clamp(128px,40vw,150px);aspect-ratio:1;flex:0 0 auto;touch-action:none;cursor:pointer}
.kreuz i{position:absolute;background:#2a2840;border:2px solid var(--ink);display:grid;place-items:center;color:#8f8ba8;font-style:normal;font-size:15px;transition:background .05s}
.kreuz .k-h,.kreuz .k-r{left:33.3%;width:33.4%;height:36%}
.kreuz .k-h{top:0;border-radius:8px 8px 0 0;border-bottom:0}
.kreuz .k-r{bottom:0;border-radius:0 0 8px 8px;border-top:0}
.kreuz .k-l,.kreuz .k-re{top:33.3%;height:33.4%;width:36%}
.kreuz .k-l{left:0;border-radius:8px 0 0 8px;border-right:0}
.kreuz .k-re{right:0;border-radius:0 8px 8px 0;border-left:0}
.kreuz .k-m{left:33.3%;top:33.3%;width:33.4%;height:33.4%;border:0;border-radius:0}
.kreuz .k-m::after{content:"";width:40%;height:40%;border-radius:50%;background:#1d1b2e}
.kreuz i.an{background:#5b5880;color:#fff}
.kreuz i.aus{color:#3d3a57}
.ab{position:relative;width:clamp(132px,40vw,150px);height:clamp(110px,33vw,124px);flex:0 0 auto}
.knopf{position:absolute;width:clamp(58px,18vw,66px);aspect-ratio:1;border-radius:50%;border:2px solid var(--ink);box-shadow:2px 3px 0 var(--ink);background:#c43a6e;color:#fff;font:800 22px "Bricolage Grotesque",Nunito,sans-serif;cursor:pointer;touch-action:none;padding:0}
.knopf.a{right:0;top:0}.knopf.b{left:0;bottom:0}
.knopf.an{transform:translate(2px,3px);box-shadow:none;background:#a52c5a}
.knopf.aus{background:#d9a3b8;box-shadow:none;border-color:#9c8f9a;color:#f5e8ee}
.knopf small{position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:5px;white-space:nowrap;font:800 11px Nunito,sans-serif;color:var(--soft)}
.gb-start{display:flex;justify-content:center;margin-top:20px}
.start{border:2px solid var(--ink);border-radius:99px;background:#8a8597;color:#fff;font:800 12px Nunito,sans-serif;letter-spacing:.12em;padding:5px 18px;cursor:pointer;transform:rotate(-20deg);touch-action:manipulation}
.start.an{background:#5f5a70}
.hilfe{color:var(--soft);font-weight:700;font-size:14px;text-align:center;margin:12px 0 0}
@media (max-height:700px){.spielkopf{margin-bottom:6px}.spielkopf .back{width:38px;height:38px}.gb{padding:8px 10px 10px}.gb-marke{display:none}.gb-pult{margin-top:8px}
  .kreuz{width:116px}.ab{width:124px;height:96px}.knopf{width:54px;font-size:19px}.gb-start{margin-top:14px}}
</style>
</head>
<body>
<div id="app"></div>
<script src="../plattform/config.js"></script>
<script src="../plattform/avatare.js"></script>
<script src="../plattform/belohnung.js"></script>
<script src="../plattform/sync.js"></script>
<script src="spiele.js"></script>
<script>
(function () {
  const $ = document.getElementById('app');
  const A = window.LernDaxAvatare, B = window.LernDaxBelohnung, SPIELE = window.LernDaxSpiele || [];
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const mmss = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  const SPIELBILD = { sprung: ['#ff6b3d', '<img src="../icons/dachs.svg" alt="">'], schlange: ['#3dbb6a', '🐍'], stapeln: ['#8b5cf6', '🧱'], zahlen: ['#ffc53d', '2048'] };
  let auswahl = { slot: 'hut', id: '' }, aktiv = null, uhr = null, meldung = '';
  A.style();

  const kopf = (titel, zurueck) => `<div class="top"><a class="back" href="${zurueck}" aria-label="Zurück">←</a><h1>${titel}</h1><span class="pill" title="Deine Münzen">🪙 <span id="muenzzahl">${B.muenzen()}</span></span></div>`;

  // ---------- Übersicht ----------
  function uebersicht() {
    const k = B.kronenZahl(), M = B.MUENZEN;
    $.innerHTML = kopf('Belohnungen', '../') + `
      <div class="held">${A.ich(96)}<div><h2>Du hast ${B.muenzen()} Münzen</h2><p>${k ? `👑 ${k} ${k === 1 ? 'Krone' : 'Kronen'} gesammelt` : 'Noch keine Krone. Schaffst du eine Runde ohne Fehler?'}</p></div></div>
      <div class="wahl">
        <a href="#laden"><span class="ic">🛍️</span><b>Laden</b><small>Hüte, Brillen, Halsschmuck und Hintergründe für deinen Avatar</small></a>
        <a class="sp" href="#spiele"><span class="ic">🎮</span><b>Spielhalle</b><small>${B.FREI ? 'Testmodus: frei' : B.rundenHeute() ? 'Heute offen: vier Spiele' : 'Öffnet nach deiner ersten Runde heute'}</small></a>
      </div>
      <div class="card regeln"><h3>So verdienst du Münzen</h3><ul>
        <li>Richtig beim ersten Versuch: 🪙 ${M.erster}</li>
        <li>Richtig beim zweiten Versuch: 🪙 ${M.zweiter}</li>
        <li>Knobel-Aufgabe geknackt: 🪙 ${M.knobel}</li>
        <li>Runde ganz ohne Fehler: 🪙 +${M.perfekt} und eine 👑 Krone</li>
        <li>Tagesziel geschafft: 🪙 +${M.tagesziel}</li></ul>
        <p class="leise">Münzen gelten in allen Fächern.</p></div>`;
  }

  // ---------- Laden ----------
  function laden() {
    const slots = A.SLOTS, preise = B.PREISE, an = B.getragen();
    const waren = A.DECO.filter((d) => d.slot === auswahl.slot);
    const probe = Object.assign({}, an, auswahl.id ? { [auswahl.slot]: auswahl.id } : {});
    const sel = A.DECO.find((d) => d.id === auswahl.id);
    let knopf = '<button class="btn hell" disabled>Tipp auf etwas, um es anzuprobieren</button>';
    if (sel) {
      const p = preise[sel.id];
      if (an[sel.slot] === sel.id) knopf = `<button class="btn hell" data-aus="${sel.slot}">${esc(sel.name)} ausziehen</button>`;
      else if (B.hat(sel.id)) knopf = `<button class="btn" data-an="${sel.id}">${esc(sel.name)} anziehen</button>`;
      else if (B.muenzen() >= p) knopf = `<button class="btn" data-kauf="${sel.id}">Kaufen für 🪙 ${p}</button>`;
      else knopf = `<button class="btn" disabled>Dir fehlen noch 🪙 ${p - B.muenzen()}</button>`;
    }
    $.innerHTML = kopf('Laden', '#') + `
      <div class="card vorschau">${A.html(A.get() || A.STANDARD, 104, '', probe)}<div class="tx"><h2>${sel ? esc(sel.name) : 'Dein Avatar'}</h2>
        <p class="leise">${meldung || (sel ? (B.hat(sel.id) ? 'Gehört dir schon.' : `Kostet 🪙 ${preise[sel.id]}. So sähe es aus.`) : 'Gekauftes bleibt für immer deins. Du kannst es jederzeit an- und ausziehen.')}</p></div></div>
      <div class="tabs" role="tablist">${slots.map(([id, name]) => `<button class="tab${id === auswahl.slot ? ' on' : ''}" data-slot="${id}" role="tab">${name}</button>`).join('')}</div>
      <div class="waren">${waren.map((d) => `<button class="ware${d.id === auswahl.id ? ' sel' : ''}" data-ware="${d.id}">
          ${an[d.slot] === d.id ? '<span class="an">an</span>' : ''}${A.html(A.get() || A.STANDARD, 64, '', Object.assign({}, an, { [d.slot]: d.id }))}
          <b>${esc(d.name)}</b><span class="preis${B.hat(d.id) ? ' hat' : ''}">${B.hat(d.id) ? '✓ deins' : `🪙 ${preise[d.id]}`}</span></button>`).join('')}</div>
      <div class="leiste">${knopf}</div>`;
    meldung = '';
  }

  // ---------- Spielhalle ----------
  function spielhalle() {
    const S = B.SPIEL, gespielt = B.gespieltHeute(), gut = B.guthaben(), rek = B.rekorde();
    let status;
    if (B.FREI) status = `<div class="card"><h2 style="font-size:20px">🧪 Testmodus</h2><p class="leise">Die Spielhalle ist gerade ganz frei: ohne Sperre, ohne Zeitgrenze, ohne Münzen.</p></div>
      <div class="spiele">${SPIELE.map((s) => `<button class="spiel" data-spiel="${s.id}"><span class="bild" style="background:${SPIELBILD[s.id][0]}">${SPIELBILD[s.id][1]}</span><b>${esc(s.name)}</b><small>${rek[s.id] ? `Rekord: ${rek[s.id]}` : 'Noch kein Rekord'}</small></button>`).join('')}</div>`;
    else if (!B.rundenHeute()) status = `<div class="card zu"><div class="gross">🔒</div><h2>Erst üben, dann spielen</h2>
        <p class="leise">Die Spielhalle öffnet, sobald du heute eine ganze Runde in einem Fach geschafft hast.</p>
        <a class="btn" href="../" style="margin-top:12px">Zu den Fächern</a></div>`;
    else {
      const kann = B.restHeute() > 0, genug = B.muenzen() >= S.preis;
      status = `<div class="card">
        <div class="zeit"><div><b id="guthaben">${mmss(gut)}</b><span>Spielzeit übrig</span></div><div><b>${mmss(gespielt)}</b><span>heute gespielt (höchstens ${S.proTag / 60} Min.)</span></div></div>
        <div class="balken" aria-hidden="true"><i style="width:${Math.min(100, Math.round((gespielt / S.proTag) * 100))}%"></i></div>
        ${kann ? `<button class="btn" data-zeit ${genug ? '' : 'disabled'} style="margin-top:12px">${genug ? `${S.sekunden / 60} Minuten holen für 🪙 ${S.preis}` : `Dir fehlen noch 🪙 ${S.preis - B.muenzen()}`}</button>`
          : `<p class="leise" style="margin-top:10px">${gut > 0 ? 'Das ist deine letzte Spielzeit für heute.' : 'Für heute ist die Spielzeit aufgebraucht. Morgen geht es weiter!'}</p>`}
        ${meldung ? `<p class="leise">${meldung}</p>` : ''}</div>
      <div class="spiele">${SPIELE.map((s) => `<button class="spiel" data-spiel="${s.id}"><span class="bild" style="background:${SPIELBILD[s.id][0]}">${SPIELBILD[s.id][1]}</span><b>${esc(s.name)}</b><small>${rek[s.id] ? `Rekord: ${rek[s.id]}` : 'Noch kein Rekord'}</small></button>`).join('')}</div>`;
    }
    $.innerHTML = kopf('Spielhalle', '#') + status;
    meldung = '';
  }

  // ---------- Ein Spiel spielen ----------
  function spielen(id) {
    const def = SPIELE.find((s) => s.id === id);
    if (!def) return go('#spiele');
    if (B.guthaben() <= 0) { meldung = 'Hol dir zuerst Spielzeit.'; return go('#spiele'); }
    const ST = def.steuer || {}, WDH = def.wiederholen || [];
    const pfeil = { hoch: '▲', runter: '▼', links: '◀', rechts: '▶' };
    const arm = (r, k) => `<i class="${k}${ST[r] ? '' : ' aus'}" data-r="${r}">${pfeil[r]}</i>`;
    const knopf = (t) => `<button class="knopf ${t}${ST[t] ? '' : ' aus'}" data-k="${t}" aria-label="${t.toUpperCase()}${ST[t] ? ': ' + ST[t][1] : ''}">${t.toUpperCase()}${ST[t] ? `<small>${esc(ST[t][1])}</small>` : ''}</button>`;
    // Kurzanleitung aus der Belegung: gleiche Texte für das Steuerkreuz zusammenfassen
    const gruppen = new Map();
    ['hoch', 'runter', 'links', 'rechts', 'a', 'b'].filter((k) => ST[k]).forEach((k) => { const t = ST[k][1]; if (!gruppen.has(t)) gruppen.set(t, []); gruppen.get(t).push(k); });
    const anleitung = [...gruppen].map(([t, ks]) => { const p = ks.filter((k) => pfeil[k]).map((k) => pfeil[k]).join(''), l = ks.filter((k) => !pfeil[k]).map((k) => k.toUpperCase()); return `${[p, ...l].filter(Boolean).join(' oder ')}: ${t}`; }).concat('Start: Pause').join(' · ');
    $.innerHTML = `<div class="spielkopf"><a class="back" href="#spiele" aria-label="Spiel beenden">←</a><h1 style="font-size:22px">${esc(def.name)}</h1>
        <span class="pill uhr" title="Spielzeit übrig">⏱ <span id="rest">${B.FREI ? 'frei' : mmss(B.guthaben())}</span></span></div>
      <div class="gb" id="gb">
        <div class="gb-schirm"><div class="buehne" id="buehne"><canvas id="cv"></canvas></div>
          <div class="gb-info"><span>Punkte <b id="pkt">0</b></span><span>Rekord <b id="rek">${B.rekorde()[id] || 0}</b></span></div></div>
        <div class="gb-marke">LERNDAX</div>
        <div class="gb-pult">
          <div class="kreuz" id="kreuz" role="group" aria-label="Steuerkreuz">${arm('hoch', 'k-h')}${arm('links', 'k-l')}<i class="k-m"></i>${arm('rechts', 'k-re')}${arm('runter', 'k-r')}</div>
          <div class="ab">${knopf('b')}${knopf('a')}</div>
        </div>
        <div class="gb-start"><button class="start" id="startK" aria-label="Start: Pause">START</button></div>
      </div>
      <p class="hilfe">${esc(def.ziel || '')}<br>${esc(anleitung)}</p>`;
    let ctl = null, laeuft = false, pausiert = false;
    const buehne = document.getElementById('buehne'), cv = document.getElementById('cv'), gb = document.getElementById('gb');
    const deckel = (html) => { buehne.querySelectorAll('.deckel').forEach((d) => d.remove()); const d = document.createElement('div'); d.className = 'deckel'; d.innerHTML = `<div>${html}</div>`; buehne.appendChild(d); return d; };
    // Bildschirm so groß wie möglich, aber Spiel und Knöpfe passen zusammen auf den Bildschirm
    const groesse = () => {
      const verh = cv.width / cv.height || 1, innen = buehne.parentElement.clientWidth - 20;
      const sonst = gb.offsetHeight - buehne.offsetHeight, oben = gb.getBoundingClientRect().top + window.scrollY;
      const hoeheFrei = window.innerHeight - oben - sonst - 10;
      buehne.style.width = Math.round(Math.max(140, Math.min(innen, hoeheFrei * verh))) + 'px';
    };
    const neu = () => {
      buehne.querySelectorAll('.deckel').forEach((d) => d.remove());
      if (ctl) ctl.stop();
      document.getElementById('pkt').textContent = '0';
      laeuft = true; pausiert = false;
      ctl = def.start(cv, {
        punkte(n) { document.getElementById('pkt').textContent = n; },
        ende(n) {
          laeuft = false;
          const neuerRekord = B.rekord(id, n);
          document.getElementById('rek').textContent = B.rekorde()[id] || 0;
          deckel(`<h2>${neuerRekord ? 'Neuer Rekord! 🏆' : 'Vorbei!'}</h2><p class="leise">${n} Punkte</p><button class="btn" data-nochmal>Nochmal</button><p class="leise">oder A drücken</p>`);
        },
      });
      groesse();
      if (window.__belohnung) window.__belohnung.spiel = ctl;
    };
    const pause = (an) => {
      if (!ctl || !laeuft) return;
      pausiert = an; if (ctl.pause) ctl.pause(an);
      document.getElementById('startK').classList.toggle('an', an);
      if (an) deckel(`<h2>Pause ⏸</h2><p class="leise">Die Spielzeit steht still.</p><button class="btn" data-weiter>Weiter</button><p class="leise">oder Start drücken</p>`);
      else buehne.querySelectorAll('.deckel').forEach((d) => d.remove());
    };
    neu();
    const summ = () => { try { if (navigator.vibrate) navigator.vibrate(8); } catch (e) {} };
    // Eine Taste des Pults: Spiel vorbei → A startet neu; Pause → jede Taste macht weiter
    const druck = (taste) => {
      if (taste === 'start') { if (laeuft) pause(!pausiert); return; }
      if (!laeuft) { if (taste === 'a' && buehne.querySelector('[data-nochmal]')) neu(); return; }
      if (pausiert) { pause(false); return; }
      const b = ST[taste]; if (b && ctl) ctl.taste(b[0]);
    };
    // Halten wiederholt (wie beim Gameboy-Tetris): erst nach 170 ms, dann alle 55 ms
    let wdh = null;
    const halten = (taste) => {
      clearTimeout(wdh); clearInterval(wdh); wdh = null;
      if (!taste) return;
      druck(taste);
      if (ST[taste] && WDH.includes(ST[taste][0])) wdh = setTimeout(() => { wdh = setInterval(() => (laeuft && !pausiert ? druck(taste) : null), 55); }, 170);
    };
    // Steuerkreuz als eine Fläche: Richtung nach der Fingerposition, Wechsel durch Rollen des Daumens
    const kreuz = document.getElementById('kreuz');
    let kreuzR = null;
    const richtungAus = (e) => {
      const r = kreuz.getBoundingClientRect(), dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
      if (Math.hypot(dx, dy) < r.width * 0.12) return kreuzR;
      return Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'rechts' : 'links') : dy > 0 ? 'runter' : 'hoch';
    };
    const kreuzSetzen = (rNeu) => {
      if (rNeu === kreuzR) return;
      kreuzR = rNeu;
      kreuz.querySelectorAll('i[data-r]').forEach((i) => i.classList.toggle('an', i.dataset.r === rNeu));
      if (rNeu) summ();
      halten(rNeu);
    };
    kreuz.addEventListener('pointerdown', (e) => { e.preventDefault(); kreuz.setPointerCapture(e.pointerId); kreuzSetzen(richtungAus(e)); });
    kreuz.addEventListener('pointermove', (e) => { if (kreuzR) kreuzSetzen(richtungAus(e)); });
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach((n) => kreuz.addEventListener(n, () => kreuzSetzen(null)));
    gb.querySelectorAll('.knopf, .start').forEach((k) => {
      const taste = k.dataset.k || 'start';
      k.addEventListener('pointerdown', (e) => { e.preventDefault(); k.classList.add('an'); summ(); halten(taste); });
      ['pointerup', 'pointercancel', 'pointerleave'].forEach((n) => k.addEventListener(n, () => { if (taste !== 'start' || !pausiert) k.classList.remove('an'); if (wdh) halten(null); }));
      k.addEventListener('contextmenu', (e) => e.preventDefault());
    });
    gb.addEventListener('contextmenu', (e) => e.preventDefault());
    // Tastatur: Pfeile = Steuerkreuz, Leertaste/X = A, Y/Z = B, Enter/P = Start
    const TASTE = { ArrowUp: 'hoch', ArrowDown: 'runter', ArrowLeft: 'links', ArrowRight: 'rechts', ' ': 'a', x: 'a', X: 'a', y: 'b', Y: 'b', z: 'b', Z: 'b', Enter: 'start', p: 'start', P: 'start' };
    const tastatur = (e) => {
      const t = TASTE[e.key]; if (!t) return; e.preventDefault();
      if (e.repeat && !(ST[t] && WDH.includes(ST[t][0]))) return;
      druck(t);
    };
    document.addEventListener('keydown', tastatur);
    // Wischen und Tippen auf dem Bildschirm gehen weiterhin
    let start = null;
    buehne.addEventListener('pointerdown', (e) => { start = { x: e.clientX, y: e.clientY }; });
    buehne.addEventListener('pointerup', (e) => {
      if (!start || !ctl || !laeuft || pausiert) return;
      const dx = e.clientX - start.x, dy = e.clientY - start.y; start = null;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return ctl.tipp();
      ctl.wisch(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'rechts' : 'links') : dy > 0 ? 'runter' : 'hoch');
    });
    buehne.addEventListener('click', (e) => { if (e.target.closest('[data-nochmal]')) neu(); else if (e.target.closest('[data-weiter]')) pause(false); });
    // Seite verlassen oder Handy gesperrt: automatisch Pause
    const sichtbar = () => { if (document.visibilityState !== 'visible' && laeuft && !pausiert) pause(true); };
    document.addEventListener('visibilitychange', sichtbar);
    window.addEventListener('resize', groesse);
    aktiv = { stop() { laeuft = false; if (ctl) ctl.stop(); clearInterval(uhr); halten(null); document.removeEventListener('keydown', tastatur); document.removeEventListener('visibilitychange', sichtbar); window.removeEventListener('resize', groesse); } };
    // Spielzeit: nur zählen, solange wirklich gespielt wird (nicht in der Pause) und die Seite sichtbar ist
    clearInterval(uhr);
    uhr = setInterval(() => {
      if (!laeuft || pausiert || document.visibilityState !== 'visible') return;
      const rest = B.sekundeGespielt();
      const el = document.getElementById('rest'); if (el && !B.FREI) el.textContent = mmss(rest);
      if (rest <= 0) {
        laeuft = false; if (ctl) ctl.stop(); clearInterval(uhr); halten(null);
        B.rekord(id, +document.getElementById('pkt').textContent || 0);
        deckel(`<h2>Zeit um! ⏱</h2><p class="leise">${document.getElementById('pkt').textContent} Punkte. ${B.restHeute() > 0 ? 'Mit Münzen kannst du dir neue Spielzeit holen.' : 'Für heute ist Schluss. Morgen geht es weiter!'}</p><a class="btn" href="#spiele">Zur Spielhalle</a>`);
      }
    }, 1000);
  }

  // ---------- Ablauf ----------
  function go(h) { if (location.hash === h) render(); else location.hash = h; }
  function render() {
    if (aktiv) { aktiv.stop(); aktiv = null; }
    const h = location.hash;
    if (h === '#laden') laden();
    else if (h === '#spiele') spielhalle();
    else if (h.startsWith('#spiel-')) spielen(h.slice(7));
    else uebersicht();
  }
  $.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.slot) { auswahl = { slot: b.dataset.slot, id: '' }; laden(); }
    else if (b.dataset.ware) { auswahl.id = auswahl.id === b.dataset.ware ? '' : b.dataset.ware; laden(); }
    else if (b.dataset.kauf) { const d = A.DECO.find((x) => x.id === b.dataset.kauf); if (B.kaufen(d.id)) { B.anziehen(d.slot, d.id); meldung = `🎉 ${d.name} gehört jetzt dir!`; } laden(); }
    else if (b.dataset.an) { const d = A.DECO.find((x) => x.id === b.dataset.an); B.anziehen(d.slot, d.id); laden(); }
    else if (b.dataset.aus) { B.anziehen(b.dataset.aus, ''); laden(); }
    else if ('zeit' in b.dataset) { const r = B.zeitKaufen(); meldung = r === 'ok' ? `Los geht's: ${B.SPIEL.sekunden / 60} Minuten Spielzeit!` : r === 'muenzen' ? 'Dafür reichen deine Münzen noch nicht.' : r === 'grenze' ? 'Für heute ist die Spielzeit aufgebraucht.' : 'Mach zuerst eine Runde in einem Fach.'; spielhalle(); }
    else if (b.dataset.spiel) { if (B.guthaben() > 0) location.hash = '#spiel-' + b.dataset.spiel; else { meldung = 'Hol dir zuerst Spielzeit mit dem Knopf oben.'; spielhalle(); } }
  });
  window.addEventListener('hashchange', render);
  B.onChange((art) => { const z = document.getElementById('muenzzahl'); if (z) z.textContent = B.muenzen(); if (art === 'sync' && !location.hash.startsWith('#spiel-')) render(); });
  render();
  if (window.LernDaxSync) window.LernDaxSync.init({ getState: () => ({}), applyState() {}, onStatus() {} });
  window.__belohnung = { B, render };
})();
</script>
